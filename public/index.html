<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web IDE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
:root{--bg:#16181d;--panel:#1c1f26;--line:#2b303a;--text:#d7dae0;--dim:#8b93a1;--accent:#4ea1ff;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.hidden{display:none!important}
button,select,input{font:inherit;color:var(--text);background:#262b35;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{background:#2f3541}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#login{height:100%;display:grid;place-items:center}
#login form{display:flex;flex-direction:column;gap:10px;width:300px;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#login h2{margin:0 0 6px}#lerr{color:var(--bad);min-height:1.2em}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .sp{flex:1}
#status{color:var(--dim);font-size:13px}
#status.on{color:var(--ok)}
#openLink{color:var(--accent);text-decoration:none;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
#main{flex:1;display:flex;min-height:0}
aside{width:250px;min-width:160px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.tools{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line)}
.tools button{padding:3px 8px}
#tree{flex:1;overflow:auto;padding:4px 0}
.row{display:flex;align-items:center;padding:2px 6px;cursor:pointer;white-space:nowrap}
.row:hover{background:#262b35}.row.sel{background:#2a3446}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .acts{display:none;gap:2px}.row:hover .acts{display:flex}
.row .acts span{padding:0 4px;border-radius:4px;color:var(--dim)}.row .acts span:hover{background:#3a4150;color:var(--text)}
.empty{color:var(--dim);padding:12px}
#ed{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);min-height:32px}
.tab{display:flex;align-items:center;gap:6px;padding:6px 12px;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--dim)}
.tab.on{color:var(--text);background:var(--bg);box-shadow:inset 0 -2px var(--accent)}
.tab .x{padding:0 3px;border-radius:4px}.tab .x:hover{background:#3a4150}
.tab .dot{color:var(--accent)}
#editor{flex:1;min-height:80px}
#bottom{height:36%;min-height:120px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#1e1e1e}
#btabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
#btabs button{border:0;border-radius:0;background:none;color:var(--dim);padding:5px 14px}
#btabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.pane{flex:1;min-height:0;padding:4px 0 0 8px}
.pane .xterm{height:100%}
@media(max-width:700px){aside{width:150px}#openLink{display:none}}
</style>
</head>
<body>
<div id="login" class="hidden">
  <form id="lf"><h2>Web IDE</h2>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button>Login</button><div id="lerr"></div></form>
</div>

<div id="app" class="hidden">
  <header>
    <select id="projSel" aria-label="Project"></select>
    <button id="newProj">+ New project</button>
    <button id="delProj" title="Delete this project">Delete</button>
    <span class="sp"></span>
    <span id="status"></span>
    <button id="runBtn">▶ Run</button>
    <button id="stopBtn">■ Stop</button>
    <a id="openLink" target="_blank" rel="noopener"></a>
    <button id="logout">Logout</button>
  </header>
  <div id="main">
    <aside>
      <div class="tools">
        <button id="nf" title="New file">+ File</button>
        <button id="nd" title="New folder">+ Folder</button>
        <button id="up" title="Upload files">Upload</button>
        <button id="rf" title="Refresh">⟳</button>
        <input id="upInput" type="file" multiple class="hidden">
      </div>
      <div id="tree"></div>
    </aside>
    <section id="ed">
      <div id="tabs"></div>
      <div id="editor"></div>
      <div id="bottom">
        <div id="btabs"><button data-t="shell" class="on">Shell</button><button data-t="console">Console</button></div>
        <div id="shell" class="pane"></div>
        <div id="consoleP" class="pane hidden"></div>
      </div>
    </section>
  </div>
</div>

<dialog id="dlg" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:20px">
  <form method="dialog" id="df" style="display:flex;flex-direction:column;gap:10px;width:280px">
    <b>New project</b>
    <input id="dName" placeholder="project-name" pattern="[A-Za-z0-9_-]{1,40}" required>
    <select id="dType"><option value="static">Static (HTML / CSS / JS)</option><option value="node">Node.js (Express)</option><option value="empty">Empty</option></select>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button value="cancel" formnovalidate>Cancel</button><button value="ok">Create</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const q = (o) => new URLSearchParams(o).toString();
let cur = null, selDir = '', editor = null, active = null, shellWs = null, logWs = null, pollT = null, kind = 'static';
const expanded = new Set(), files = new Map();

async function call(method, url, body) {
  const r = await fetch(url, { method, credentials: 'same-origin',
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined });
  if (r.status === 401 && !url.endsWith('/login')) { showLogin(); throw new Error('Unauthorized'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const err = (e) => { if (e.message !== 'Unauthorized') alert(e.message); };

// ── terminals ──
const mkTerm = (el, opts) => { const t = new Terminal({ fontSize: 13, theme: { background: '#1e1e1e' }, ...opts }); const f = new FitAddon.FitAddon(); t.loadAddon(f); t.open(el); return [t, f]; };
let termS, fitS, termC, fitC;
function initTerms() {
  [termS, fitS] = mkTerm($('#shell'), { cursorBlink: true });
  [termC, fitC] = mkTerm($('#consoleP'), { disableStdin: true, convertEol: false });
  termS.onData((d) => { if (shellWs && shellWs.readyState === 1) shellWs.send(d); else if (d === '\r') connectShell(); });
  new ResizeObserver(fitAll).observe($('#bottom'));
}
function fitAll() { try { fitS.fit(); fitC.fit(); } catch {} }
const wsUrl = (p, o) => `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${p}?${q(o)}`;
function connectShell() {
  if (shellWs) { shellWs.onclose = null; shellWs.close(); }
  termS.reset(); fitAll();
  const ws = new WebSocket(wsUrl('/_term', { project: cur, cols: termS.cols, rows: termS.rows }));
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => termS.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data));
  ws.onclose = () => termS.write('\r\n\x1b[31m[shell disconnected — Enter চাপলে reconnect হবে]\x1b[0m\r\n');
  shellWs = ws;
}
function connectLogs() {
  if (logWs) { logWs.onclose = null; logWs.close(); }
  termC.reset();
  const ws = new WebSocket(wsUrl('/_logs', { project: cur }));
  ws.onmessage = (e) => termC.write(e.data);
  logWs = ws;
}
document.querySelectorAll('#btabs button').forEach((b) => b.onclick = () => showBottom(b.dataset.t));
function showBottom(t) {
  document.querySelectorAll('#btabs button').forEach((x) => x.classList.toggle('on', x.dataset.t === t));
  $('#shell').classList.toggle('hidden', t !== 'shell');
  $('#consoleP').classList.toggle('hidden', t !== 'console');
  fitAll(); (t === 'shell' ? termS : termC).focus();
}

// ── projects ──
async function loadProjects(pick) {
  const list = await call('GET', '/_api/projects');
  const sel = $('#projSel'); sel.innerHTML = '';
  list.forEach((p) => sel.add(new Option(`${p.name}  (${p.kind === 'node' ? 'node' : 'static'})`, p.name)));
  const want = pick || localStorage.getItem('ide_proj');
  const name = list.find((p) => p.name === want) ? want : (list[0] && list[0].name);
  if (name) { sel.value = name; await selectProject(name); }
  else { cur = null; $('#tree').innerHTML = '<div class="empty">কোনো project নেই। “+ New project” চাপো।</div>'; setStatus(); }
}
async function selectProject(name) {
  cur = name; localStorage.setItem('ide_proj', name); selDir = ''; expanded.clear();
  for (const f of files.values()) f.model.dispose(); files.clear(); active = null; editor.setModel(null); renderTabs();
  await loadTree(); connectShell(); connectLogs(); refreshStatus();
  clearInterval(pollT); pollT = setInterval(refreshStatus, 3000);
}
$('#projSel').onchange = (e) => selectProject(e.target.value).catch(err);
$('#newProj').onclick = () => { $('#dName').value = ''; $('#dlg').showModal(); };
$('#df').onsubmit = async (e) => {
  if (e.submitter && e.submitter.value !== 'ok') return;
  try { const name = $('#dName').value.trim(); await call('POST', '/_api/projects', { name, type: $('#dType').value }); await loadProjects(name); } catch (x) { err(x); }
};
$('#delProj').onclick = async () => {
  if (!cur || !confirm(`"${cur}" project আর সব file মুছে যাবে. নিশ্চিত?`)) return;
  try { await call('DELETE', '/_api/projects/' + cur); localStorage.removeItem('ide_proj'); await loadProjects(); } catch (x) { err(x); }
};

// ── run / status ──
async function refreshStatus() {
  if (!cur) return;
  try {
    const s = await call('GET', `/_api/projects/${cur}/status`);
    kind = s.kind;
    const url = `${location.origin}/p/${cur}/`;
    $('#openLink').href = url; $('#openLink').textContent = url;
    $('#runBtn').classList.toggle('hidden', kind !== 'node');
    $('#stopBtn').classList.toggle('hidden', kind !== 'node' || !s.running);
    $('#runBtn').textContent = s.running ? '↻ Restart' : '▶ Run';
    setStatus(kind === 'static' ? 'static · always live' : s.running ? '● running' : '○ stopped', kind === 'static' || s.running);
  } catch {}
}
function setStatus(t = '', on = false) { $('#status').textContent = t; $('#status').classList.toggle('on', on); }
$('#runBtn').onclick = async () => { try { await saveAll(); await call('POST', `/_api/projects/${cur}/run`); showBottom('console'); refreshStatus(); } catch (x) { err(x); } };
$('#stopBtn').onclick = async () => { try { await call('POST', `/_api/projects/${cur}/stop`); refreshStatus(); } catch (x) { err(x); } };

// ── tree ──
async function loadTree() {
  if (!cur) return;
  const t = await call('GET', '/_api/tree?' + q({ project: cur }));
  const root = $('#tree'); root.innerHTML = '';
  if (!t.length) root.innerHTML = '<div class="empty">খালি project. “+ File” দিয়ে শুরু করো।</div>';
  draw(t, root, 0);
}
function draw(nodes, parent, depth) {
  for (const n of nodes) {
    const row = document.createElement('div');
    row.className = 'row' + (n.path === selDir && n.type === 'dir' ? ' sel' : '');
    row.style.paddingLeft = 8 + depth * 14 + 'px';
    const open = expanded.has(n.path);
    row.innerHTML = `<span class="nm">${n.type === 'dir' ? (open ? '▾ ' : '▸ ') : '· '}${esc(n.name)}</span><span class="acts"><span data-a="ren" title="Rename">✎</span><span data-a="del" title="Delete">✕</span></span>`;
    row.onclick = (e) => {
      const a = e.target.dataset.a;
      if (a === 'ren') return rename(n);
      if (a === 'del') return del(n);
      if (n.type === 'dir') { open ? expanded.delete(n.path) : expanded.add(n.path); selDir = n.path; loadTree(); }
      else openFile(n.path).catch(err);
    };
    parent.appendChild(row);
    if (n.type === 'dir' && open) draw(n.children, parent, depth + 1);
  }
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const inSel = (n) => (selDir ? selDir + '/' + n : n);
async function mk(type) {
  const n = prompt((type === 'dir' ? 'Folder' : 'File') + ' name' + (selDir ? ` (in ${selDir})` : ''));
  if (!n) return;
  try { await call('POST', '/_api/fs', { project: cur, path: inSel(n.trim()), type }); if (selDir) expanded.add(selDir); await loadTree(); if (type === 'file') openFile(inSel(n.trim())); } catch (x) { err(x); }
}
$('#nf').onclick = () => mk('file'); $('#nd').onclick = () => mk('dir'); $('#rf').onclick = () => loadTree();
async function rename(n) {
  const to = prompt('New path', n.path);
  if (!to || to === n.path) return;
  try { closeUnder(n.path); await call('POST', '/_api/rename', { project: cur, from: n.path, to: to.trim() }); await loadTree(); } catch (x) { err(x); }
}
async function del(n) {
  if (!confirm(`"${n.path}" মুছবে?`)) return;
  try { closeUnder(n.path); await call('DELETE', `/_api/fs?${q({ project: cur, path: n.path })}`); if (selDir === n.path) selDir = ''; await loadTree(); } catch (x) { err(x); }
}
$('#up').onclick = () => $('#upInput').click();
$('#upInput').onchange = async (e) => {
  try {
    for (const f of e.target.files) {
      const r = await fetch('/_api/upload?' + q({ project: cur, path: inSel(f.name) }), { method: 'PUT', credentials: 'same-origin', body: await f.arrayBuffer() });
      if (!r.ok) throw new Error((await r.json()).error);
    }
    e.target.value = ''; await loadTree();
  } catch (x) { err(x); }
};

// ── editor / tabs ──
async function openFile(p) {
  if (files.has(p)) return activate(p);
  const j = await call('GET', '/_api/file?' + q({ project: cur, path: p }));
  if (j.binary) return alert('Binary বা অনেক বড় file — এখানে edit করা যাবে না।');
  const model = monaco.editor.createModel(j.content, undefined, monaco.Uri.file('/' + cur + '/' + p));
  const f = { model, saved: j.content, dirty: false };
  model.onDidChangeContent(() => { const d = model.getValue() !== f.saved; if (d !== f.dirty) { f.dirty = d; renderTabs(); } });
  files.set(p, f); activate(p);
}
function activate(p) { active = p; editor.setModel(files.get(p).model); renderTabs(); editor.focus(); }
function renderTabs() {
  const t = $('#tabs'); t.innerHTML = '';
  for (const [p, f] of files) {
    const d = document.createElement('div'); d.className = 'tab' + (p === active ? ' on' : '');
    d.innerHTML = `<span>${esc(p.split('/').pop())}</span>${f.dirty ? '<span class="dot">●</span>' : ''}<span class="x">✕</span>`;
    d.title = p;
    d.onclick = (e) => (e.target.classList.contains('x') ? closeFile(p) : activate(p));
    t.appendChild(d);
  }
}
function closeFile(p) {
  const f = files.get(p); if (!f) return;
  if (f.dirty && !confirm(`${p} save হয়নি। তবুও বন্ধ করবে?`)) return;
  f.model.dispose(); files.delete(p);
  if (active === p) { active = [...files.keys()].pop() || null; active ? activate(active) : editor.setModel(null); }
  renderTabs();
}
function closeUnder(p) { for (const k of [...files.keys()]) if (k === p || k.startsWith(p + '/')) { files.get(k).dirty = false; closeFile(k); } }
async function save(p) {
  const f = files.get(p); if (!f || !f.dirty) return;
  const v = f.model.getValue();
  await call('PUT', '/_api/file', { project: cur, path: p, content: v });
  f.saved = v; f.dirty = false; renderTabs();
}
async function saveAll() { for (const p of files.keys()) await save(p); }
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (active) save(active).catch(err); } });

// ── boot ──
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#pw').focus(); }
$('#lf').onsubmit = async (e) => {
  e.preventDefault();
  try { await call('POST', '/_api/login', { password: $('#pw').value }); $('#pw').value = ''; $('#lerr').textContent = ''; start(); }
  catch (x) { $('#lerr').textContent = x.message; }
};
$('#logout').onclick = async () => { await call('POST', '/_api/logout', {}).catch(() => {}); location.reload(); };

let booted = false;
async function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (!booted) {
    booted = true;
    await new Promise((res) => {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
      require(['vs/editor/editor.main'], () => {
        editor = monaco.editor.create($('#editor'), { theme: 'vs-dark', automaticLayout: true, fontSize: 14, minimap: { enabled: false }, model: null });
        res();
      });
    });
    initTerms();
  }
  await loadProjects().catch(err);
}
call('GET', '/_api/projects').then(start).catch(showLogin);
</script>
</body>
</html>
